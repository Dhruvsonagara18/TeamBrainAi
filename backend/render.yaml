services:
  - type: web
    name: teambrain-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_NAME
        value: teambrain
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: EMBEDDING_MODEL
        value: voyage-3.5
      - key: ENVIRONMENT
        value: production
      - key: MONGODB_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: MONGODB_ATLAS_AI_KEY
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
